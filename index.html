<!doctype html>
<html lang="en">
  <head>
    <title>Student Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
  </head>


<nav class="navbar navbar-primary bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand text-white fw-bold fs-4" href="#">
      <i class="bi bi-mortarboard-fill me-2"></i>
      Student Dashboard
    </a>
  </div>
</nav>

<main class="container py-4">
  <div class="card border-0 shadow-sm rounded-3 overflow-hidden">

    <div class="card-header bg-white p-3 p-md-4">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <h4 class="text-primary fw-bold mb-0">
            Daftar Nilai Siswa
          </h4>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-search"></i>
            </span>

            <input
              type="text"
              id="search"
              class="form-control"
              placeholder="Cari nama siswa..."
            >
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" class="text-start">No</th>
            <th scope="col">Nama Siswa</th>
            <th scope="col" class="text-start">Kelas</th>
            <th scope="col" class="text-start">Nilai (Score)</th>
          </tr>
        </thead>

        <tbody id="tabelSiswa"></tbody>
      </table>
    </div>

    <div class="card-footer bg-white p-3 p-md-4">
      <div class="d-flex justify-content-end align-items-center gap-3">
        <span class="text-secondary fw-semibold">
          Rata-rata Nilai Kelas:
        </span>

        <span
          id="rataRata"
          class="badge bg-primary fs-4 px-3 py-2"
        >
          0
        </span>
      </div>
    </div>

  </div>
</main>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
